name: Feature request / 功能建议
description: Describe a use case and the behavior you need.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case / 使用场景
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior / 期望行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints / 替代方法及限制
