name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Determine target tag
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${tag} already exists; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install test dependencies
        if: steps.meta.outputs.exists != 'true'
        run: python -m pip install -r requirements-dev.txt

      - name: Run verification suite before release
        if: steps.meta.outputs.exists != 'true'
        run: |
          python -m pytest -q --ignore=tests/test_portal_browser.py
          python -m compileall -q .
          bash -n install.sh
          bash -n uninstall.sh
          python tools/check_frontend.py
          python tools/check_public_tree.py

      - name: Build and self-verify release archive
        if: steps.meta.outputs.exists != 'true'
        run: python tools/build_release.py --output dist --tag "${{ steps.meta.outputs.tag }}"

      - name: Publish GitHub Release
        if: steps.meta.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          gh release create "${tag}"             "dist/antigravity-suite-${tag}-source.zip"             "dist/antigravity-suite-${tag}-source.zip.sha256"             --target "${GITHUB_SHA}"             --title "${tag}"             --notes-file "dist/release-notes.md"
