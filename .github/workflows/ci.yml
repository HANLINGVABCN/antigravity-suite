name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} on Linux
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
            os: ubuntu-24.04
          - python: '3.11'
            os: ubuntu-latest
          - python: '3.14'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Regression tests
        run: python -m pytest -q
      - name: Python, Bash and frontend syntax
        run: |
          python -m compileall -q .
          bash -n install.sh
          bash -n uninstall.sh
          python tools/check_frontend.py
      - name: Check public source tree
        run: python tools/check_public_tree.py

  browser:
    name: Chromium interface on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-browser.txt
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps --no-shell chromium
      - name: Responsive layouts and interaction regressions
        run: python -m pytest -q tests/test_portal_browser.py
