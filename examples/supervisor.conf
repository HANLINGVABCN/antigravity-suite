# Replace all paths before including this file in your Supervisor configuration.
[program:antigravity-suite]
command=/path/to/antigravity-suite/.venv/bin/python /path/to/antigravity-suite/server.py
directory=/path/to/antigravity-suite
environment=ANTIGRAVITY_SUITE_DATA="/path/to/private-data",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=70
stopasgroup=false
killasgroup=true
umask=0077
stdout_logfile=/path/to/private-data/suite.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
